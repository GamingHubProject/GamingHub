# Explicit project name — Compose otherwise defaults to the checkout
# directory's basename, which collides with the production installer's
# hardcoded /opt/gaming-hub (same basename: "gaming-hub"). Without this,
# both share one Compose project: same container names, same postgres_data
# volume, same default image tags — confirmed for real, including a
# production container silently running the dev image and a shared
# postgres volume getting clobbered between the two.
name: gaming-hub-dev

services:
  app:
    build: .
    ports:
      - "8010:8000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=gaming_hub
      - DB_USERNAME=gaming_hub
      - DB_PASSWORD=secret
    volumes:
      - .:/app
    depends_on:
      - postgres
    command: php artisan serve --host=0.0.0.0 --port=8000
  scheduler:
    build: .
    env_file:
      - .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=gaming_hub
      - DB_USERNAME=gaming_hub
      - DB_PASSWORD=secret
    volumes:
      - .:/app
    depends_on:
      - postgres
    command: php artisan gaming-hub:poll-providers
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=gaming_hub
      - POSTGRES_USER=gaming_hub
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
