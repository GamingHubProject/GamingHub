# Explicit project name — Compose otherwise defaults to the install
# directory's basename. The installer's own DEFAULT_INSTALL_DIR is
# /opt/gaming-hub, and a dev checkout is very commonly also named
# "gaming-hub" (this repo's own directory name) — without this, the two
# share one Compose project: same container names, same postgres_data
# volume, same default image tags. Confirmed for real: a production
# container silently running the dev-built image, and a shared postgres
# volume getting clobbered between the two installs.
#
# GAMING_HUB_INSTANCE lets several production-style installs coexist on
# one host too (e.g. "prod" and a second "staging" deployment) — the
# installer always exports it (prompted fresh on Install, read back from
# .env on Update/HTTPS/admin/Uninstall) and passes -p explicitly on top of
# this, which takes precedence; the "prod" default here only matters for
# a bare "docker compose" run outside the installer.
name: gaming-hub-${GAMING_HUB_INSTANCE:-prod}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    # Belt-and-suspenders alongside the project name above: explicit
    # rather than Compose's own default "<project>-<service>" naming, so
    # this image can never collide with a dev build (or another instance's
    # build) even if a project name were ever left unset again. A
    # production container ended up silently running the dev image (no
    # vendor/ baked in, since dev relies on a bind mount + a separate
    # composer install step) and crash-looping on a missing
    # vendor/autoload.php — this is what closes that gap.
    image: gaming-hub-${GAMING_HUB_INSTANCE:-prod}-app:latest
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-Gaming Hub}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-gaming_hub}
      - DB_USERNAME=${DB_USERNAME:-gaming_hub}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - app_storage:/app/storage
    depends_on:
      - postgres
    ports:
      - "${APP_PORT:-8000}:8000"
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    # Same image as app (identical Dockerfile/context) — reusing the tag
    # here means Compose only builds it once instead of duplicating an
    # identical ~1.9GB image under a second name.
    image: gaming-hub-${GAMING_HUB_INSTANCE:-prod}-app:latest
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-Gaming Hub}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-gaming_hub}
      - DB_USERNAME=${DB_USERNAME:-gaming_hub}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - app_storage:/app/storage
    depends_on:
      - postgres
      - app
    entrypoint: []
    command: php artisan gaming-hub:poll-providers
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-gaming_hub}
      - POSTGRES_USER=${DB_USERNAME:-gaming_hub}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  app_storage:
